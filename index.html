
<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PlayTime</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #00ff41;
            font-family: Consolas, monospace;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            color: red;
            text-align: center;
            font-size: 32px;
        }

        #terminal {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.6;
            font-size: 14px;
        }

        .cursor {
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        #result {
            color: white;
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>YOU'VE BEEN HACKED!</h1>
    <div id="terminal"></div><span class="cursor">█</span>
    <h2 id="result"></h2>
    <script>
const code = `
Who Am I?
        K who?
Initializing security system...

Connecting to  server...

Loading system files...

function initializeSystem() {
    let security = "ACTIVE";

    console.log("System initialized");

    function scanSystem() {
        console.log("Scanning environment...");
    }

    scanSystem();
}

class HackerSimulation {
    constructor() {
        this.status = "SUCCESS";
    }

    run() {
        initializeSystem();
        console.log("Simulation complete!");
    }
}

let = new HackerSimulation();
run();

ACCESS GRANTED...

SYSTEM CHECK COMPLETE...
`;

let position = 0;

const terminal = document.getElementById("terminal");
const result = document.getElementById("result");

const typingTimer = setInterval(function() {

    position++;

    terminal.textContent = code.substring(0, position);

    if (position >= code.length) {
        clearInterval(typingTimer);

        result.textContent =
            "EASY :)))";
    }

}, 120);
    </script>
</body>
</html>
