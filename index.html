<!DOCTYPE html>
<html>
<head>
    <title>Facebook</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            width: 350px;
        }

        h1 {
            color: #1877f2;
            font-size: 45px;
            margin-bottom: 10px;
        }

        .login {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 10px #ccc;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            background: #1877f2;
            color: white;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }

        #warning {
            color: #d00;
            font-weight: bold;
            margin-top: 15px;
        }

        .notice {
            color: #555;
            font-size: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Facebook</h1>
        <p></p>
        <div class="login">
            <form onsubmit="">
                <input type="text" placeholder="username" required>
                <input type="password" placeholder="password" required>
                <button type="submit">Log In</button>
            </form>
            <p id="warning"></p>
            <p class="notice"></p>
        </div>
    </div>
    <script>
        function showWarning(event) {
            event.preventDefault();

        }
    </script>
</body>
</html>
